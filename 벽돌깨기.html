<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>심화 수학 탐구: 1211 신지원</title>
    <style>
        body { 
            text-align: center; 
            background-color: #121212; 
            color: #fff; 
            font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; 
            overflow: hidden; 
        }
        h2 { 
            margin-top: 15px; 
            color: #FFD700; 
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); 
            letter-spacing: 2px;
        }
        canvas { 
            background: #1e1e1e; 
            display: block; 
            margin: 10px auto; 
            border: 3px solid #444; 
            box-shadow: 0 0 40px rgba(0,0,0,0.8); 
            border-radius: 8px; 
        }
        .info { font-size: 0.9em; color: #ccc; line-height: 1.6; margin-bottom: 20px;}
        .math-tag { 
            display: inline-block; background: #333; 
            padding: 3px 8px; border-radius: 4px; 
            color: #5bc0de; font-weight: bold; margin: 0 5px; 
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h2>🧱 수학적 물리 엔진: 1211 신지원 🧱</h2>
    
    <canvas id="myCanvas" width="600" height="600"></canvas>
    
    <div class="info">
        <div><span class="math-tag">[캡처 팁]</span> 키보드 <strong>'P'</strong>를 누르면 화면이 정지합니다. (보고서용 캡처)</div>
        <div><span class="math-tag">[수열 Sequence]</span> 레벨 비례 속도 증가 ($v_n = v_1 + (n-1)d$)</div>
        <div><span class="math-tag">[행렬 Matrix]</span> 회전변환 행렬을 이용한 멀티볼 ($30^\circ$)</div>
        <div><span class="math-tag">[벡터 Vector]</span> 피타고라스 정리를 이용한 속도 보존</div>
    </div>

<script>
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // ==========================================
    // 0. 캡처를 위한 일시정지 기능 (추가됨)
    // ==========================================
    let isPaused = false; // 멈춤 상태 변수

    document.addEventListener("keydown", (e) => {
        // P 키를 누르면 멈췄다 풀었다 함
        if(e.key === "p" || e.key === "P") {
            isPaused = !isPaused;
            if(!isPaused) draw(); // 다시 시작할 때 draw() 호출
        }
    });

    // ==========================================
    // 1. 게임 상태 변수 (레벨, 점수)
    // ==========================================
    let level = 1;
    let score = 0;
    
    // 초기 속도 (레벨 1 기준)
    const BASE_SPEED = 3.0; 
    let currentSpeed = BASE_SPEED;

    // ==========================================
    // 2. 수학적 도구 (행렬 회전)
    // ==========================================
    function rotateVector(vx, vy, angleDegrees) {
        let theta = angleDegrees * (Math.PI / 180);
        let newVx = vx * Math.cos(theta) - vy * Math.sin(theta);
        let newVy = vx * Math.sin(theta) + vy * Math.cos(theta);
        return { x: newVx, y: newVy };
    }

    // ==========================================
    // 3. 객체 클래스
    // ==========================================
    class Ball {
        constructor(x, y, dx, dy) {
            this.x = x; this.y = y;
            this.dx = dx; this.dy = dy;
            this.radius = 8;
            this.active = true;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
            ctx.closePath(); ctx.shadowBlur = 0;
        }
        update() {
            this.x += this.dx; this.y += this.dy;
            if(this.x + this.dx > canvas.width - this.radius || this.x + this.dx < this.radius) this.dx = -this.dx;
            if(this.y + this.dy < this.radius) this.dy = -this.dy;
            else if(this.y > canvas.height) this.active = false;
        }
    }

    let particles = [];
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random()-0.5)*6; this.vy = (Math.random()-0.5)*6;
            this.gravity = 0.2; this.alpha = 1; this.color = color;
        }
        update() { this.vy += this.gravity; this.x += this.vx; this.y += this.vy; this.alpha -= 0.02; }
        draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fillStyle = this.color; ctx.fill(); ctx.restore(); }
    }

    // ==========================================
    // 4. 초기화 및 레벨 설정
    // ==========================================
    let balls = [];
    
    // 패들
    const paddleHeight = 12;
    const paddleWidth = 100;
    let paddleX = (canvas.width - paddleWidth) / 2;
    let rightPressed = false, leftPressed = false;

    // 벽돌
    const brickRowCount = 6;
    const brickColumnCount = 7;
    const brickWidth = 70;
    const brickHeight = 25;
    const brickPadding = 10;
    const brickOffsetTop = 60;
    const brickOffsetLeft = 25;
    
    let bricks = [];
    const colors = ["#FF3333", "#FF8C00", "#FFD700", "#ADFF2F", "#00FA9A", "#00BFFF"];

    // 벽돌 초기화 함수
    function initBricks() {
        for(let c=0; c<brickColumnCount; c++) {
            bricks[c] = [];
            for(let r=0; r<brickRowCount; r++) {
                let type = (r === 2) ? 2 : 1; // 3번째 줄은 아이템
                bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r], type: type };
            }
        }
    }
    initBricks(); 

    // 공 초기화 함수
    function resetBall() {
        balls = [];
        currentSpeed = BASE_SPEED + (level - 1) * 0.5;
        balls.push(new Ball(canvas.width/2, canvas.height-60, currentSpeed, -currentSpeed));
        paddleX = (canvas.width - paddleWidth) / 2;
    }
    resetBall();

    document.addEventListener("keydown", (e) => { if(e.key=="Right"||e.key=="ArrowRight") rightPressed=true; else if(e.key=="Left"||e.key=="ArrowLeft") leftPressed=true; });
    document.addEventListener("keyup", (e) => { if(e.key=="Right"||e.key=="ArrowRight") rightPressed=false; else if(e.key=="Left"||e.key=="ArrowLeft") leftPressed=false; });

    // ==========================================
    // 5. 게임 로직
    // ==========================================
    function collisionDetection() {
        let activeBricksCount = 0; 

        for(let i = 0; i < balls.length; i++) {
            let bObj = balls[i];
            let collisionHappened = false; 

            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status == 1) {
                        activeBricksCount++; 
                        
                        if (!collisionHappened) {
                            let closestX = Math.max(b.x, Math.min(bObj.x, b.x + brickWidth));
                            let closestY = Math.max(b.y, Math.min(bObj.y, b.y + brickHeight));
                            let distSq = (bObj.x - closestX)**2 + (bObj.y - closestY)**2;

                            if (distSq < bObj.radius * bObj.radius) {
                                bObj.dy = -bObj.dy;
                                b.status = 0;
                                score += 10; 
                                collisionHappened = true; 
                                for(let k=0; k<10; k++) particles.push(new Particle(b.x+brickWidth/2, b.y+brickHeight/2, b.color));

                                if (b.type === 2) { 
                                    let left = rotateVector(bObj.dx, bObj.dy, -30);
                                    let right = rotateVector(bObj.dx, bObj.dy, 30);
                                    balls.push(new Ball(bObj.x, bObj.y, left.x, left.y));
                                    balls.push(new Ball(bObj.x, bObj.y, right.x, right.y));
                                }
                            }
                        }
                    }
                }
            }
        }

        if(activeBricksCount === 0) {
            level++;
            alert(`Level ${level} 시작! 속도가 빨라집니다.`);
            initBricks();
            resetBall();  
        }
    }

    function drawScoreLevel() {
        ctx.font = "16px Arial";
        ctx.fillStyle = "#fff";
        ctx.textAlign = "left";
        ctx.fillText("Score: " + score, 8, 20);
        ctx.textAlign = "right";
        ctx.fillText("Level: " + level + " (Speed: " + currentSpeed.toFixed(1) + ")", canvas.width-8, 20);
    }

    // ==========================================
    // 6. 메인 루프 (여기에 멈춤 기능 추가됨)
    // ==========================================
    function draw() {
        // [중요] 일시정지 상태면 그리지 않고 함수 종료 (화면 멈춤)
        if(isPaused) return;

        ctx.fillStyle = 'rgba(26, 26, 26, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawScoreLevel();

        // 벽돌 그리기
        for(let c=0; c<brickColumnCount; c++) {
            for(let r=0; r<brickRowCount; r++) {
                if(bricks[c][r].status == 1) {
                    let bx = (c*(brickWidth+brickPadding)) + brickOffsetLeft;
                    let by = (r*(brickHeight+brickPadding)) + brickOffsetTop;
                    bricks[c][r].x = bx; bricks[c][r].y = by;
                    ctx.beginPath();
                    ctx.roundRect(bx, by, brickWidth, brickHeight, 4);
                    ctx.fillStyle = bricks[c][r].color;
                    ctx.fill();
                    if(bricks[c][r].type === 2) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
                    ctx.closePath();
                }
            }
        }

        ctx.beginPath();
        ctx.roundRect(paddleX, canvas.height-paddleHeight-10, paddleWidth, paddleHeight, 5);
        ctx.fillStyle = "#00BFFF";
        ctx.fill();
        ctx.closePath();

        particles.forEach((p, i) => { if(p.alpha<=0) particles.splice(i,1); else { p.update(); p.draw(); } });

        for(let i = 0; i < balls.length; i++) {
            let b = balls[i];
            if(!b.active) { balls.splice(i, 1); i--; continue; }
            b.draw(); b.update();

            if(b.y + b.dy > canvas.height - b.radius - 10) {
                if(b.x > paddleX && b.x < paddleX + paddleWidth) {
                    let hitPoint = (b.x - (paddleX + paddleWidth/2)) / (paddleWidth/2);
                    let spd = Math.sqrt(b.dx*b.dx + b.dy*b.dy); 
                    b.dx = hitPoint * (spd * 0.9);
                    b.dy = -Math.sqrt(spd*spd - b.dx*b.dx);
                }
            }
        }

        if(balls.length === 0) {
            alert("GAME OVER! 최종 점수: " + score);
            document.location.reload();
            return;
        }

        collisionDetection();

        if(rightPressed && paddleX < canvas.width-paddleWidth) paddleX += 7;
        else if(leftPressed && paddleX > 0) paddleX -= 7;

        requestAnimationFrame(draw);
    }

    draw();
</script>
</body>
</html>
